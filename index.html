  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- UTILITIES & API HELPER ---
    function rp(n) {
      const num = Number(n || 0);
      return 'Rp ' + num.toLocaleString('id-ID');
    }

    function fmtDate(iso, withTime = false) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const pad = (v) => (v < 10 ? '0' + v : String(v));
        let base = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
        if (withTime) {
          base += ` ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        return base;
      } catch {
        return iso;
      }
    }

    function cleanWaInput(val) {
      let v = String(val || '').replace(/\D/g, '');
      if (v.startsWith('0')) {
        v = '62' + v.slice(1);
      }
      return v;
    }

    function createReceiptPdf(sale) {
      const JsPDF = window.jspdf && window.jspdf.jsPDF;
      if (!JsPDF) {
        throw new Error('Generator PDF belum siap. Silakan coba lagi.');
      }

      const paperWidth = 58;
      const margin = 4;
      const contentWidth = paperWidth - margin * 2;
      const measureDoc = new JsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: [paperWidth, 200],
        compress: true,
      });
      const productText = String(sale.PRODUK || 'Tidak ada detail produk');
      const productLines = measureDoc.splitTextToSize(productText, contentWidth);
      const buyerLines = measureDoc.splitTextToSize(
        `Pembeli: ${String(sale.NAMA_PEMBELI || 'Pelanggan Umum')}`,
        contentWidth
      );
      const calculatedHeight = Math.max(
        110,
        54 + (productLines.length + buyerLines.length) * 4.2
      );

      const doc = new JsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: [paperWidth, calculatedHeight],
        compress: true,
      });
      let y = 8;
      const lineHeight = 4.2;

      const center = (text, size, bold = false) => {
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        doc.setFontSize(size);
        doc.text(String(text), paperWidth / 2, y, { align: 'center' });
        y += size <= 9 ? 4 : 5;
      };
      const rule = () => {
        doc.setDrawColor(0);
        doc.line(margin, y, paperWidth - margin, y);
        y += 4;
      };
      const wrapped = (text, size = 9, bold = false, align = 'left') => {
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        doc.setFontSize(size);
        const lines = doc.splitTextToSize(String(text), contentWidth);
        doc.text(lines, align === 'center' ? paperWidth / 2 : margin, y, {
          align,
          lineHeightFactor: 1.15,
        });
        y += Math.max(1, lines.length) * lineHeight;
      };
      const row = (label, value, bold = false) => {
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        doc.setFontSize(8.5);
        doc.text(String(label), margin, y);
        doc.text(String(value), paperWidth - margin, y, { align: 'right' });
        y += lineHeight;
      };

      center('Dwisyafitriproject', 14, true);
      center('STRUK PEMBAYARAN KASIR', 8, true);
      y += 1;
      rule();
      row('No Trx:', sale.NO_TRANSAKSI || sale.ID || '-');
      row('Tanggal:', fmtDate(sale.TANGGAL, true));
      wrapped(`Pembeli: ${sale.NAMA_PEMBELI || 'Pelanggan Umum'}`, 8.5, true);
      row('Metode:', String(sale.METODE || '-').toUpperCase(), true);
      y += 1;
      rule();
      wrapped('DETAIL PESANAN', 8, true);
      wrapped(productText, 9, true);
      y += 1;
      rule();
      row('Total Tagihan:', rp(sale.HARGA), true);
      row('Bayar:', rp(sale.BAYAR));
      row('Kembalian:', rp(sale.KEMBALIAN), true);
      y += 4;
      wrapped('Terima kasih telah berbelanja di Dwisyafitriproject!', 8, true, 'center');

      const filename = `struk-${sale.NO_TRANSAKSI || sale.ID || 'transaksi'}.pdf`
        .replace(/[^a-zA-Z0-9._-]/g, '-');
      return {
        blob: doc.output('blob'),
        dataUri: doc.output('datauristring'),
        filename,
      };
    }

    function downloadReceiptPdf(pdf) {
      const url = URL.createObjectURL(pdf.blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = pdf.filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function maskWa(wa) {
      if (!wa || wa.length < 6) return wa;
      return wa.slice(0, 4) + '•••' + wa.slice(-3);
    }

    function convertDriveLink(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      const matchParam = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (matchParam && matchParam[1]) {
        return `https://lh3.googleusercontent.com/d/${matchParam[1]}`;
      }
      return url;
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 400;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > MAX) {
              h = Math.round((h * MAX) / w);
              w = MAX;
            }
          } else {
            if (h > MAX) {
              w = Math.round((w * MAX) / h);
              h = MAX;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/jpeg', 0.7));
          } else {
            callback(e.target.result);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbxh1uOsPRj35674362d0wu4a2UOtbGh1ZBtZTmch_PdN7jg-BkdeOsseQQmV3XkdMIh/exec";

function gasCall(action, payload) {
  return new Promise((resolve) => {

    // Jika dijalankan di Google Apps Script
    if (typeof google !== "undefined" &&
        google.script &&
        google.script.run) {

      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          resolve({
            ok: false,
            message: String(err)
          });
        })
        .handleAction(action, payload);

    } else {

      // Jika dijalankan di GitHub Pages
      fetch(API_URL, {
        method: "POST",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: action,
          payload: payload
        })
      })
      .then(res => res.json())
      .then(resolve)
      .catch(err => {
        resolve({
          ok: false,
          message: err.message
        });
      });

    }

  });
}

    const INDO_MONTHS = [

      const handleSharePdf = async () => {
        // 1. Ambil & validasi nomor WhatsApp, konversi 08xx → 628xx otomatis
        const phone = cleanWaInput(sharePhone);
        if (phone.length < 8) {
          alert('Masukkan nomor WhatsApp tujuan yang valid.');
          return;

        setIsSharing(true);
        try {
          // 2. Generate file PDF dari data struk yang sedang tampil di browser
          const pdf = createReceiptPdf(sale);

          // 3. Upload PDF ke Google Drive (folder otomatis dibuat jika belum ada)
          //    Server akan set permission "Anyone with the link can view" secara otomatis
          const result = await gasCall('uploadReceiptPdfToDrive', {
            base64: pdf.dataUri,
            filename: pdf.filename,
            folderName: 'Struk Transaksi Dwisyafitriproject',
          });

          if (!result || !result.ok) {
            throw new Error(result?.message || 'Gagal mengupload PDF ke Google Drive.');
          }

          // 4. Ambil URL file PDF dari Google Drive
          const driveUrl = result.fileUrl;

          // 5. Buat pesan otomatis berisi sapaan, detail transaksi, dan link Drive
          const totalBelanja = typeof sale.HARGA === 'number'
            ? sale.HARGA.toLocaleString('id-ID')

          const message = [
            `Halo ${sale.NAMA_PEMBELI || 'Pelanggan'}, terima kasih sudah berbelanja di Dwisyafitriproject! 🙏`,

            ``,
            `Semoga puas dengan pelayanan kami! 😊`,
          ].join('\n');

          // 6. Gabungkan nomor, pesan, dan link ke format URL WhatsApp siap klik
          const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

          // 7. Buka chat WhatsApp customer secara otomatis
          window.open(waUrl, '_blank');

          setIsShareOpen(false);

    function UlasanPage({ reviews, onAddReview, isLoading }) {
      const [nama, setNama] = useState('');
      const [wa, setWa] = useState('');
      const [rating, setRating] = useState(5);
      const [reviewText, setReviewText] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const averageRating = useMemo(() => {
        if (reviews.length === 0) return '5.0';
        const sum = reviews.reduce((acc, r) => acc + (Number(r.RATING) || 5), 0);
        return (sum / reviews.length).toFixed(1);
      }, [reviews]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!nama.trim() || !reviewText.trim()) return;

        setIsSubmitting(true);
        try {
          await onAddReview({
            NAMA: nama.trim(),

    // AdminKasirTab (POS Multi-Product)
    function AdminKasirTab({ products, sales, onSaveSale, onDeleteSale, onShowReceipt }) {
      const [editingId, setEditingId] = useState(null);
      const [nama, setNama] = useState('');
      const [wa, setWa] = useState('');
      const [cart, setCart] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState('');
      const [metode, setMetode] = useState('Cash');
      const [bayar, setBayar] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const totalHarga = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.harga * item.qty, 0);
      }, [cart]);

      const handleAddProductToCart = (prodName) => {
        if (!prodName) return;
        const prod = products.find((x) => x.NAMA === prodName);
        if (!prod) return;

        setCart((prev) => {
          const existing = prev.find((x) => x.nama === prod.NAMA);
          if (existing) {
            return prev.map((x) =>
              x.nama === prod.NAMA ? { ...x, qty: x.qty + 1 } : x
            );
          }
          return [...prev, { nama: prod.NAMA, harga: prod.HARGA, qty: 1 }];
        });
        setSelectedProduct('');
      };

      const handleUpdateQty = (namaProd, delta) => {
        setCart((prev) =>
          prev
            .map((x) => {
              if (x.nama === namaProd) {
                const newQty = x.qty + delta;
                return newQty > 0 ? { ...x, qty: newQty } : null;
              }
              return x;
            })
            .filter(Boolean)
        );
      };

      const handleRemoveFromCart = (namaProd) => {
        setCart((prev) => prev.filter((x) => x.nama !== namaProd));
      };

      const handleMetodeChange = (e) => {
        const val = e.target.value;
        setMetode(val);
        if (val !== 'Cash') {
          setBayar(totalHarga);
        } else {
          setBayar('');
        }
      };

      const currentBayarNum = bayar === '' ? (metode === 'Cash' ? 0 : totalHarga) : Number(bayar);
      const kembalian = metode === 'Cash' ? Math.max(0, currentBayarNum - totalHarga) : 0;

      const handleResetForm = () => {
        setEditingId(null);
        setNama('');
        setWa('');
        setCart([]);
        setSelectedProduct('');
        setMetode('Cash');
        setBayar('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!nama.trim() || cart.length === 0 || totalHarga <= 0) return;
        if (metode === 'Cash' && currentBayarNum < totalHarga) return;

        const produkSummary = cart.map((i) => `${i.nama} (${i.qty}x)`).join(', ');

        setIsSubmitting(true);
        try {
          const savedSale = await onSaveSale({
            ID: editingId || undefined,
            NAMA_PEMBELI: nama.trim(),
            WHATSAPP: cleanWaInput(wa),
            PRODUK: produkSummary,
            HARGA: totalHarga,
            BAYAR: currentBayarNum,
            METODE: metode,
            KEMBALIAN: kembalian,
            TANGGAL: new Date().toISOString(),
          });
          handleResetForm();
          if (savedSale) {
            onShowReceipt(savedSale);
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
          {/* Form Kasir POS */}
          <div className="bg-white neo-border neo-shadow p-6 h-fit">
            <h3 className="font-black text-lg mb-4 border-b-2 border-black pb-2">Input Penjualan Kasir</h3>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase mb-1">Nama Pembeli *</label>
                <input
                  type="text"
                  required
                  value={nama}
                  onChange={(e) => setNama(e.target.value)}
                  placeholder="Pelanggan Umum "
                  className="w-full neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">No. WhatsApp</label>
                <input
                  type="text"
                  value={wa}
                  onChange={(e) => setWa(e.target.value)}
                  placeholder="08xx-xxx-xxx"
                  className="w-full neo-border px-3 py-2 text-sm bg-white font-bold outline-none focus:neo-shadow"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase mb-1">Pilih Produk *</label>

    // AdminArusCashTab (Arus Cash Keuangan, Cash Runway, Net Profit Margin & PDF Generator)
    function AdminArusCashTab({ sales, expenses, onSaveExpense, onDeleteExpense }) {
      const [selectedMonth, setSelectedMonth] = useState('Semua Bulan');
      const [formKeterangan, setFormKeterangan] = useState('');
      const [formJumlah, setFormJumlah] = useState('');
      const [formTanggal, setFormTanggal] = useState(() => new Date().toISOString().split('T')[0]);
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const monthOptions = useMemo(() => {
        const set = new Set([
          'Semua Bulan',
          'Mei 2025',
          'April 2025',
          'Maret 2025',
          ...sales.map((s) => getMonthYearStr(s.TANGGAL)).filter(Boolean),
          ...expenses.map((e) => getMonthYearStr(e.TANGGAL)).filter(Boolean),
        ]);
        return Array.from(set);
      }, [sales, expenses]);

      const displaySales = useMemo(() => {
        if (!selectedMonth || selectedMonth === 'Semua Bulan') return sales;
        return sales.filter((s) => getMonthYearStr(s.TANGGAL) === selectedMonth);
      }, [sales, selectedMonth]);

      const displayExpenses = useMemo(() => {
        if (!selectedMonth || selectedMonth === 'Semua Bulan') return expenses;
        return expenses.filter((e) => getMonthYearStr(e.TANGGAL) === selectedMonth);
      }, [expenses, selectedMonth]);

      const totalOmzet = useMemo(() => {
        return displaySales.reduce((sum, s) => sum + (Number(s.HARGA) || 0), 0);
      }, [displaySales]);

      const totalPengeluaran = useMemo(() => {
        return displayExpenses.reduce((sum, e) => sum + (Number(e.JUMLAH) || 0), 0);
      }, [displayExpenses]);

      const cashBersih = totalOmzet - totalPengeluaran;

      const runwayPercentage = totalPengeluaran > 0 ? Math.min(100, Math.round((totalOmzet / totalPengeluaran) * 100)) : 100;

      const expenseMonthsSet = new Set(
        displayExpenses.map((e) => {
          if (!e.TANGGAL) return 'default';
          const d = new Date(e.TANGGAL);
          return isNaN(d.getTime()) ? 'default' : `${d.getFullYear()}-${d.getMonth() + 1}`;
        })
      );
      const distinctExpenseMonths = Math.max(1, expenseMonthsSet.size);

      const monthlyExpense = selectedMonth && selectedMonth !== 'Semua Bulan'
        ? totalPengeluaran
        : totalPengeluaran > 0 ? totalPengeluaran / distinctExpenseMonths : 0;

      const monthsRunway = monthlyExpense > 0 && cashBersih > 0
        ? (cashBersih / monthlyExpense).toFixed(1)
        : totalPengeluaran === 0 && totalOmzet > 0 ? '∞' : '0.0';

      const netProfitMargin = totalOmzet > 0
        ? ((cashBersih / totalOmzet) * 100).toFixed(1)
        : '0.0';

      const expenseRatio = totalOmzet > 0
        ? Math.round((totalPengeluaran / totalOmzet) * 100)
        : (totalPengeluaran > 0 ? 100 : 0);

      const handleEditExpense = (exp) => {
        setEditingExpenseId(exp.ID);
        setFormKeterangan(exp.KETERANGAN || '');
        setFormJumlah(exp.JUMLAH ? String(exp.JUMLAH) : '');
        setFormTanggal(exp.TANGGAL ? new Date(exp.TANGGAL).toISOString().split('T')[0] : new Date().toISOString().split('T')[0]);
      };

      const handleResetExpense = () => {
        setEditingExpenseId(null);
        setFormKeterangan('');
        setFormJumlah('');
        setFormTanggal(new Date().toISOString().split('T')[0]);
      };

      const handleSubmitExpense = async (e) => {
        e.preventDefault();
        if (!formKeterangan.trim() || !formJumlah) return;

        setIsSubmitting(true);
        try {
          await onSaveExpense({
            ID: editingExpenseId || undefined,
            KETERANGAN: formKeterangan.trim(),
            JUMLAH: Number(formJumlah),
            TANGGAL: new Date().toISOString(),
          });
          handleResetExpense();
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDownloadPDF = () => {
        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          alert('Mohon izinkan pop-up browser untuk mengunduh/mencetak laporan PDF.');
          return;
        }

        const htmlContent = `

          </head>
          <body>

                <div class="card-value">${netProfitMargin}%</div>
              </div>
            </div>

            <div class="table-title">1. Riwayat Pemasukan (Otomatis dari Kasir)</div>
            <table>
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Keterangan</th>
                  <th class="text-right">Jumlah (Rp)</th>
                </tr>
              </thead>
              <tbody>
                ${displaySales.length === 0 ? '<tr><td colspan="3" style="text-align:center;">Tidak ada data pemasukan.</td></tr>' : 
                  displaySales.map(s => `
                    <tr>
                      <td>${fmtDate(s.TANGGAL)}</td>

                </tr>
              </tfoot>
            </table>

            <div class="table-title">2. Riwayat Pengeluaran</div>
            <table>

                <tr>
                  <th>Tanggal</th>
                  <th>Keterangan</th>
                  <th class="text-right">Jumlah (Rp)</th>
                </tr>
              </thead>
              <tbody>
                ${displayExpenses.length === 0 ? '<tr><td colspan="3" style="text-align:center;">Tidak ada data pengeluaran.</td></tr>' : 
                  displayExpenses.map(e => `
                    <tr>
                      <td>${fmtDate(e.TANGGAL)}</td>
                      <td>${e.KETERANGAN}</td>
                      <td class="text-right">${(Number(e.JUMLAH) || 0).toLocaleString('id-ID')}</td>
                    </tr>
                  `).join('')
                }
              </tbody>
              <tfoot>
                <tr style="font-weight:bold; background:#f0f0f0;">
                  <td colspan="2">Total Pengeluaran</td>
                  <td class="text-right">${totalPengeluaran.toLocaleString('id-ID')}</td>
                </tr>
              </tfoot>
            </table>

              <div>
                <p style="font-size: 10px; color: #888;">* Laporan ini di-generate secara otomatis oleh Sistem Kasir Dwisyafitriproject.</p>
              </div>
              <div class="signature">
                <p>Pemilik / Admin Toko,</p>
                <div class="signature-line"></div>
                <p style="margin-top: 5px; font-weight: bold;">( Admin Toko )</p>
              </div>
            </div>

            <script>
              window.onload = function() {
                window.print();
              };
            <\/script>
          </body>
          </html>
        `;

        printWindow.document.open();
        printWindow.document.write(htmlContent);
        printWindow.document.close();
      };

      return (

    function App() {
      const [currentPage, setCurrentPage] = useState('katalog');

      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);

      const [sales, setSales] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [reviews, setReviews] = useState([]);

      const [isLoading, setIsLoading] = useState(true);
      const [toast, setToast] = useState(null);

      const [receiptSale, setReceiptSale] = useState(null);
      const [confirmConfig, setConfirmConfig] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const loadInitialData = async () => {
        setIsLoading(true);
        try {
          const [resP, resS, resE, resR] = await Promise.all([
            gasCall('getProduk'),
            gasCall('getPenjualan'),
            gasCall('getPengeluaran'),
            gasCall('getReview'),
          ]);

          if (resP && resP.data) setProducts(resP.data);
          if (resS && resS.data) setSales(resS.data);
          if (resE && resE.data) setExpenses(resE.data);
          if (resR && resR.data) setReviews(resR.data);
        } catch (e) {
          console.error('Error loading data:', e);
          } finally {
          setIsLoading(false);
        }
      };

      const loadInitialData = async () => {
  // 1. Ambil data dari LocalStorage (Cache) lebih dulu
  const cachedData = localStorage.getItem('cached_portfolio_data');
  
  if (cachedData) {
    try {
      const parsed = JSON.parse(cachedData);
      // Tampilkan data produk/proyek secara INSTAN dari memori browser
      setProducts(parsed.projects || parsed || []); 
      setIsLoading(false); // Langsung hilangkan pesan "Memuat produk..."
    } catch (e) {
      console.error('Gagal membaca cache:', e);
    }
  } else {
    // Jika belum ada cache sama sekali (pertama kali buka), baru tampilkan spinner/loading
    setIsLoading(true);
  }

  // 2. Minta data paling baru dari Google Apps Script di latar belakang (Background)
  try {
    const response = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getPortfolioData' })
    });
    
    const result = await response.json();
    
    // Perbarui state dengan data terbaru dari Google Sheets
    const freshProducts = result.projects || [];
    setProducts(freshProducts);
    
    // Simpan data terbaru ke LocalStorage untuk kunjungan berikutnya
    localStorage.getItem('cached_portfolio_data', JSON.stringify(result));
    
  } catch (error) {
    console.error('Gagal sinkronisasi data dari backend:', error);
  } finally {
    // Pastikan loading benar-benar selesai
    setIsLoading(false);
  }
};

      // Handlers Produk
      const handleSaveProduct = async (p) => {
        const res = await gasCall('saveProduk', p);
        if (res && res.data) {
          setProducts(res.data);
          showToast('Produk berhasil disimpan!');
          return true;
        } else {
          showToast(res?.message || 'Gagal menyimpan produk', 'error');
          return false;
        }
      };

      const handleDeleteProduct = (id) => {
        setConfirmConfig({
          isOpen: true,
          title: 'Hapus Produk',
          message: 'Apakah Anda yakin ingin menghapus produk ini?',
          onConfirm: async () => {
            setConfirmConfig(null);
            const res = await gasCall('deleteProduk', { ID: id });
            if (res && res.data) {
              setProducts(res.data);
              showToast('Produk berhasil dihapus');
            } else {
              showToast('Gagal menghapus produk', 'error');
            }
          },
        });
      };

      // Handlers Penjualan
      const handleSaveSale = async (s) => {
        const res = await gasCall('savePenjualan', s);
        if (res && res.data) {
          setSales(res.data);
          showToast('Transaksi berhasil disimpan!');
          const savedItem = res.data.find((x) => x.NAMA_PEMBELI === s.NAMA_PEMBELI && x.HARGA === s.HARGA) || s;
          return savedItem;
        } else {
          showToast(res?.message || 'Gagal menyimpan transaksi', 'error');
          return null;
        }
      };

          isOpen: true,

      };

      // Handlers Review
      const handleAddReview = async (r) => {
        const res = await gasCall('addReview', r);
        if (res && res.data) {
          setReviews(res.data);
          showToast('Terima kasih atas ulasan Anda!');
        } else {
          showToast(res?.message || 'Gagal mengirim ulasan', 'error');
        }
      };

      const handleUpdateReview = async (r) => {
        const res = await gasCall('updateReview', r);
        if (res && res.data) {
          setReviews(res.data);
          showToast('Ulasan berhasil diperbarui!');
          return true;
        } else {
          showToast(res?.message || 'Gagal memperbarui ulasan', 'error');
          return false;
        }
      };

      const handleDeleteReview = (id) => {
        setConfirmConfig({
          isOpen: true,
          title: 'Hapus Ulasan',
          message: 'Apakah Anda yakin ingin menghapus ulasan ini?',
          onConfirm: async () => {
            setConfirmConfig(null);
            const res = await gasCall('deleteReview', { ID: id });
            if (res && res.data) {
              setReviews(res.data);
              showToast('Ulasan berhasil dihapus');
            } else {
              showToast('Gagal menghapus ulasan', 'error');
            }
          },
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F5F5F5]">
          <Header
            currentPage={currentPage}
            setCurrentPage={setCurrentPage}
            isAdminLoggedIn={isAdminLoggedIn}
            onOpenLogin={() => setIsLoginModalOpen(true)}
            onLogout={() => {
              setIsAdminLoggedIn(false);
              setCurrentPage('katalog');
              showToast('Logout Admin berhasil');
            }}
          />

          <main className="flex-1 flex flex-col">
            {currentPage === 'katalog' && (
              <KatalogPage products={products} isLoading={isLoading} />
            )}

            {currentPage === 'ulasan' && (
              <UlasanPage
                reviews={reviews}
                onAddReview={handleAddReview}
                isLoading={isLoading}
              />
            )}

            {currentPage === 'admin' && (
              isAdminLoggedIn ? (
                <AdminDashboard
                  products={products}
                  sales={sales}
                  expenses={expenses}
                  reviews={reviews}
                  onSaveProduct={handleSaveProduct}
                  onDeleteProduct={handleDeleteProduct}
                  onSaveSale={handleSaveSale}
                  onDeleteSale={handleDeleteSale}
                  onSaveExpense={handleSaveExpense}
                  onDeleteExpense={handleDeleteExpense}
                  onUpdateReview={handleUpdateReview}
                  onDeleteReview={handleDeleteReview}
                  onShowReceipt={(s) => setReceiptSale(s)}
                />
              ) : (
                <div className="max-w-md mx-auto my-12 p-6 bg-white neo-border neo-shadow text-center">
                  <p className="font-extrabold mb-4">Silakan login admin untuk mengakses halaman ini.</p>
                  <button
                    onClick={() => setIsLoginModalOpen(true)}
                    className="bg-[#00E5FF] neo-border neo-shadow px-6 py-2.5 font-extrabold text-xs"
                  >
                    Login Admin Sekarang
                  </button>
                </div>
              )
            )}
          </main>

          <Footer />

          {/* Modal & Toast Overlays */}
          <AdminLogin
            isOpen={isLoginModalOpen}
            onClose={() => setIsLoginModalOpen(false)}
            onLoginSuccess={() => {
              setIsAdminLoggedIn(true);
              setCurrentPage('admin');
            }}
            showToast={showToast}
          />

          <StrukModal
            isOpen={!!receiptSale}
            sale={receiptSale}
            onClose={() => setReceiptSale(null)}
          />

          <ConfirmModal
            isOpen={!!confirmConfig?.isOpen}
            title={confirmConfig?.title}
            message={confirmConfig?.message}
            onConfirm={confirmConfig?.onConfirm}
            onCancel={() => setConfirmConfig(null)}
          />

          <Toast toast={toast} />
        </div>
      );
    }

    // Render App ke Element DOM #root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Script Module untuk Vite Dev Environment -->
  <script type="module">
    // Vite loader fallback jika dijalankan di Node/Vite preview container
    if (typeof window.React === 'undefined') {
      import('/src/main.tsx');
    }
  </script>
</body>
</html>
